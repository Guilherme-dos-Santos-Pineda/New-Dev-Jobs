# nginx da VM Oracle — serve TUDO num domínio só:
#
#   /            → landing (HTML estático de pages/)        indexável no 1º passe
#   /docs.html   → landing
#   /login /app/ → app React (SPA)
#   /api/        → proxy pro Node em 127.0.0.1:3001
#
# Mesma origem para o app e a API: não existe CORS entre eles, e o apex serve o
# conteúdo indexável (o subdomínio era tratado como site separado pelo Google).
#
# Instalar:
#   sudo cp deploy/oracle/nginx-newdevjobs.conf /etc/nginx/sites-available/newdevjobs
#   sudo ln -sf /etc/nginx/sites-available/newdevjobs /etc/nginx/sites-enabled/newdevjobs
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (DEPOIS que o DNS do apex já apontar para esta VM):
#   sudo certbot --nginx -d newdevjobs.xyz -d www.newdevjobs.xyz \
#                        -d landing.newdevjobs.xyz -d api.newdevjobs.xyz
# O certbot reescreve este arquivo adicionando os blocos 443 e o redirect 80→443.
#
# Os arquivos ficam em /var/www/newdevjobs (ver deploy/oracle/deploy-static.sh).

# ---------------------------------------------------------------------------
# api.newdevjobs.xyz — mantido por compatibilidade. O webhook do Stripe, o
# GOOGLE_REDIRECT_URI e o certificado já emitido apontam para cá; derrubar este
# host quebraria pagamento e login com Google.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.newdevjobs.xyz;

    client_max_body_size 12m;

    access_log /var/log/nginx/newdevjobs.api.access.log;
    error_log  /var/log/nginx/newdevjobs.api.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # A app faz `app.set('trust proxy', 1)`: sem estes headers o rate-limit
        # veria todo mundo como 127.0.0.1 e bloquearia todos de uma vez.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O webhook do Stripe valida a assinatura sobre o corpo CRU. Buffer
        # desligado para o corpo chegar intacto.
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

# ---------------------------------------------------------------------------
# landing.newdevjobs.xyz — endereço ANTIGO da landing, já indexado pelo Google.
# www.newdevjobs.xyz — variante do apex.
#
# Ambos dão 301 permanente para o apex, preservando o caminho. No caso do
# 'landing.' é o que transfere o histórico de indexação em vez de descartá-lo;
# no caso do 'www' evita servir conteúdo duplicado em dois hostnames (o
# canonical resolveria, mas o 301 é inequívoco e não gasta rastreio).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name landing.newdevjobs.xyz www.newdevjobs.xyz;

    return 301 https://newdevjobs.xyz$request_uri;
}

# ---------------------------------------------------------------------------
# newdevjobs.xyz — landing + app + API na mesma origem.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name newdevjobs.xyz;

    root /var/www/newdevjobs;
    index index.html;

    client_max_body_size 12m;

    access_log /var/log/nginx/newdevjobs.access.log;
    error_log  /var/log/nginx/newdevjobs.error.log;

    # Headers de segurança dos estáticos (o helmet cobre só a API). Espelha o
    # que os arquivos _headers faziam no Render/Cloudflare Pages.
    add_header X-Frame-Options        DENY                          always;
    add_header X-Content-Type-Options nosniff                       always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # --- API: mesma origem, então o front chama /api/... sem CORS -----------
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # --- Assets do app: nome com hash, então cache imutável e longo ---------
    # Precisa vir ANTES do bloco /app/ (prefixo mais longo vence no nginx).
    location ^~ /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- App React ---------------------------------------------------------
    # Qualquer rota sob /app/ que não seja arquivo real cai na shell do SPA.
    location = /app {
        return 301 /app/;
    }
    location ^~ /app/ {
        try_files $uri /app/index.html;
    }

    # Rotas públicas do React Router que vivem FORA de /app/ (ver App.jsx).
    # Listadas uma a uma de propósito: um `try_files` genérico devolveria a shell
    # do SPA para QUALQUER URL inexistente, matando o 404 real — que é o que
    # sinaliza ao Google que a página não existe.
    location = /login  { try_files /app/index.html =404; }
    location = /signup { try_files /app/index.html =404; }
    location = /forgot { try_files /app/index.html =404; }
    location = /reset  { try_files /app/index.html =404; }

    # --- Landing (HTML estático) -------------------------------------------
    # Fica por último: só pega o que os blocos acima não pegaram.
    location / {
        try_files $uri $uri/ =404;
    }
}
