# Keep-alive do plano gratuito do Render.
#
# Por que existe: no free tier o serviço DORME após ~15 min sem request. Isso não
# causa só lentidão no primeiro acesso — como o worker roda embutido na API
# (RUN_WORKER=true), o serviço dormindo significa que **envios não saem e os robôs
# não disparam**. O ping mantém o processo vivo.
#
# Custo: US$ 0 (GitHub Actions é grátis em repositório público; em privado, o
# plano free dá 2.000 min/mês e este workflow gasta ~15 min/mês).
#
# CONFIGURAR: Settings → Secrets and variables → Actions → New repository secret
#   API_URL = https://newdevjobs-api.onrender.com   (sem barra no fim)
#
# ⚠️ O agendador do GitHub não é pontual: em horário de pico o disparo pode
# atrasar alguns minutos. Para keep-alive isso é irrelevante (o Render só derruba
# após 15 min ociosos), mas não trate como cron de precisão.

name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *" # a cada 10 min — folga contra os 15 min do Render
  workflow_dispatch: # permite disparar na mão pela aba Actions

# Se um ping ainda estiver rodando, não empilha outro.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acordar a API
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::secret API_URL não configurado — veja o cabeçalho deste arquivo"
            exit 1
          fi
          # --max-time 90: um serviço dormindo leva ~30-50s para acordar (cold start).
          # --retry 2: tolera uma falha isolada sem marcar o workflow como quebrado.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   --max-time 90 --retry 2 --retry-delay 15 \
                   "$API_URL/api/health")
          echo "GET /api/health → HTTP $code"
          [ "$code" = "200" ] || { echo "::error::health check falhou (HTTP $code)"; exit 1; }
