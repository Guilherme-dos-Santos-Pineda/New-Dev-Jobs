# nginx como proxy reverso da API newdevjobs (Oracle Cloud).
#
# Instalar:
#   sudo cp deploy/oracle/nginx-newdevjobs.conf /etc/nginx/sites-available/newdevjobs
#   sudo ln -sf /etc/nginx/sites-available/newdevjobs /etc/nginx/sites-enabled/newdevjobs
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: rode `sudo certbot --nginx -d api.newdevjobs.xyz` DEPOIS de subir isto.
# O certbot reescreve este arquivo adicionando o bloco 443 e o redirect 80->443.

server {
    listen 80;
    listen [::]:80;
    server_name api.newdevjobs.xyz;

    # Uploads de currículo (PDF) — o backend limita o JSON em 1 MB, mas o
    # multipart do CV passa por aqui. O padrão do nginx (1m) rejeitaria PDFs comuns.
    client_max_body_size 12m;

    access_log /var/log/nginx/newdevjobs.access.log;
    error_log  /var/log/nginx/newdevjobs.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # A app faz `app.set('trust proxy', 1)`: sem estes headers o rate-limit
        # veria todo mundo como 127.0.0.1 e bloquearia todos de uma vez.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O webhook do Stripe valida a assinatura sobre o corpo CRU. Buffer
        # desligado para o corpo chegar intacto.
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
