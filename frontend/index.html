<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E0F10" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="New Dev Jobs" />
    <title>New Dev Jobs: candidaturas automáticas para devs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Versao FIXA de proposito: em @latest o icon set muda sozinho entre deploys.
         O caminho tem `dist/`: sem ele o CDN devolve 404 e TODOS os icones somem
         da aplicacao de uma vez, sem erro visivel em lugar nenhum. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
    <script>
        // aplica tema antes do render para evitar flash
        (function () {
            // Escuro é o padrão: só fica claro quem escolheu claro.
            if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark');
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
