# nginx da VM Oracle — serve TUDO num domínio só:
#
#   /            → landing (HTML estático de pages/)        indexável no 1º passe
#   /docs.html   → landing
#   /login /app/ → app React (SPA)
#   /api/        → proxy pro Node em 127.0.0.1:3001
#
# Mesma origem para o app e a API: não existe CORS entre eles, e o apex serve o
# conteúdo indexável (o subdomínio era tratado como site separado pelo Google).
#
# Instalar:
#   sudo cp deploy/oracle/nginx-newdevjobs.conf /etc/nginx/sites-available/newdevjobs
#   sudo ln -sf /etc/nginx/sites-available/newdevjobs /etc/nginx/sites-enabled/newdevjobs
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS — ATENÇÃO: este arquivo só tem blocos `listen 80`. Os blocos 443 são
# escritos pelo CERTBOT na cópia instalada em /etc/nginx/sites-available/.
# Toda vez que o deploy-static.sh reinstala este arquivo, o HTTPS cai até o
# certbot rodar de novo (o script avisa). Rode DEPOIS que o DNS apontar aqui:
#   sudo certbot --nginx -d newdevjobs.xyz -d www.newdevjobs.xyz \
#                        -d landing.newdevjobs.xyz -d api.newdevjobs.xyz
# O certbot reescreve este arquivo adicionando os blocos 443 e o redirect 80→443.
#
# Os arquivos ficam em /var/www/newdevjobs (ver deploy/oracle/deploy-static.sh).

# ---------------------------------------------------------------------------
# api.newdevjobs.xyz — mantido por compatibilidade. O webhook do Stripe, o
# GOOGLE_REDIRECT_URI e o certificado já emitido apontam para cá; derrubar este
# host quebraria pagamento e login com Google.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.newdevjobs.xyz;

    client_max_body_size 12m;

    access_log /var/log/nginx/newdevjobs.api.access.log;
    error_log  /var/log/nginx/newdevjobs.api.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # A app faz `app.set('trust proxy', 1)`: sem estes headers o rate-limit
        # veria todo mundo como 127.0.0.1 e bloquearia todos de uma vez.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O webhook do Stripe valida a assinatura sobre o corpo CRU. Buffer
        # desligado para o corpo chegar intacto.
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

# ---------------------------------------------------------------------------
# landing.newdevjobs.xyz — endereço ANTIGO da landing, já indexado pelo Google.
# www.newdevjobs.xyz — variante do apex.
#
# Ambos dão 301 permanente para o apex, preservando o caminho. No caso do
# 'landing.' é o que transfere o histórico de indexação em vez de descartá-lo;
# no caso do 'www' evita servir conteúdo duplicado em dois hostnames (o
# canonical resolveria, mas o 301 é inequívoco e não gasta rastreio).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name landing.newdevjobs.xyz www.newdevjobs.xyz;

    return 301 https://newdevjobs.xyz$request_uri;
}

# ---------------------------------------------------------------------------
# newdevjobs.xyz — landing + app + API na mesma origem.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name newdevjobs.xyz;

    root /var/www/newdevjobs;
    index index.html;

    client_max_body_size 12m;

    access_log /var/log/nginx/newdevjobs.access.log;
    error_log  /var/log/nginx/newdevjobs.error.log;

    # ------------------------------------------------------------------
    # HEADERS DE SEGURANÇA — repetidos em cada location de propósito.
    #
    # No nginx, `add_header` só é herdado por locations que NÃO declaram um
    # `add_header` próprio. Declará-los uma vez no server parecia funcionar e
    # produzia dois bugs silenciosos:
    #   • /app/assets/ (que declara Cache-Control) perdia TODOS eles, inclusive
    #     o nosniff — o que de fato importa para JS e CSS;
    #   • /api/ os herdava e colidia com o helmet, saindo com dois
    #     X-Frame-Options de valores diferentes (SAMEORIGIN e DENY). Navegador
    #     que vê XFO conflitante costuma descartar os dois.
    #
    # Por isso: quem serve ESTÁTICO declara; /api/ não declara nada e fica
    # inteiramente por conta do helmet, como manda o CLAUDE.md.
    # ------------------------------------------------------------------

    # --- API: sem add_header aqui. Os headers são do helmet. ---------------
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # --- Assets do app: nome com hash, então cache imutável e longo ---------
    # Precisa vir ANTES do bloco /app/ (prefixo mais longo vence no nginx).
    location ^~ /app/assets/ {
        # Um Cache-Control só: `expires` emitiria o seu próprio header e, somado
        # ao add_header, o response sairia com a diretiva duplicada.
        add_header Cache-Control          "public, immutable, max-age=31536000" always;
        add_header X-Frame-Options        DENY                           always;
        add_header X-Content-Type-Options nosniff                        always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        access_log off;
        try_files $uri =404;
    }

    # --- App React ---------------------------------------------------------
    # $is_args$args é OBRIGATÓRIO aqui. `return` não anexa a query string
    # sozinho (ao contrário de `rewrite`), e o callback do Google volta para
    # /app?code=...  — sem isso o código do OAuth some no redirect e o login
    # falha silenciosamente, com o app carregando sem sessão.
    location = /app {
        return 301 /app/$is_args$args;
    }
    location ^~ /app/ {
        add_header X-Frame-Options        DENY                           always;
        add_header X-Content-Type-Options nosniff                        always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        # no-cache = revalide sempre (com ETag vira um 304 barato). O deploy
        # apaga os chunks antigos, então um index.html servido do cache pediria
        # arquivos que já não existem: o import() falha e o Suspense do React
        # trava no spinner para sempre. A landing entra junto porque o CSS e as
        # imagens dela NÃO têm hash no nome — só /app/assets/ tem.
        add_header Cache-Control          "no-cache"                     always;
        # Caminho COM extensão que não existe é ARQUIVO faltando, não rota do
        # SPA: devolver a shell com 200 faz um chunk ausente parecer HTML
        # válido e mascara o erro real. Rotas do React Router não têm ponto.
        # Precisa repetir os headers: location aninhado com add_header próprio
        # não herda os de cima.
        location ~ ^/app/.+\.[a-zA-Z0-9]+$ {
            add_header X-Frame-Options        DENY                           always;
            add_header X-Content-Type-Options nosniff                        always;
            add_header Referrer-Policy        strict-origin-when-cross-origin always;
            add_header Cache-Control          "no-cache"                     always;
            try_files $uri =404;
        }

        try_files $uri /app/index.html;
    }

    # Rotas públicas do React Router que vivem FORA de /app/ (ver App.jsx).
    # Enumeradas de propósito: um `try_files` genérico devolveria a shell do SPA
    # para QUALQUER URL inexistente, matando o 404 real — que é o que sinaliza
    # ao Google que a página não existe. Regex casa antes do prefixo `/`.
    location ~ ^/(login|signup|forgot|reset)$ {
        add_header X-Frame-Options        DENY                           always;
        add_header X-Content-Type-Options nosniff                        always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        # no-cache = revalide sempre (com ETag vira um 304 barato). O deploy
        # apaga os chunks antigos, então um index.html servido do cache pediria
        # arquivos que já não existem: o import() falha e o Suspense do React
        # trava no spinner para sempre. A landing entra junto porque o CSS e as
        # imagens dela NÃO têm hash no nome — só /app/assets/ tem.
        add_header Cache-Control          "no-cache"                     always;
        try_files /app/index.html =404;
    }

    # --- Landing (HTML estático) -------------------------------------------
    # Fica por último: só pega o que os blocos acima não pegaram.
    location / {
        # no-cache = revalide sempre (com ETag vira um 304 barato). O deploy
        # apaga os chunks antigos, então um index.html servido do cache pediria
        # arquivos que já não existem: o import() falha e o Suspense do React
        # trava no spinner para sempre. A landing entra junto porque o CSS e as
        # imagens dela NÃO têm hash no nome — só /app/assets/ tem.
        add_header Cache-Control          "no-cache"                     always;
        add_header X-Frame-Options        DENY                           always;
        add_header X-Content-Type-Options nosniff                        always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }
}
