# Render Blueprint — newdevjobs
#
# STACK GRATUITO: 1 serviço Node (plano free) + 2 sites estáticos (sempre grátis).
# Banco/Auth/Storage = Supabase (externo). Secrets no env group "newdevjobs-secrets".
# Crie o grupo em Render → Env Groups e preencha os valores (ver DEPLOY.md).
#
# O que mudou (antes eram 5 serviços, ~US$14/mês):
#   • worker  → REMOVIDO: fundido na API (RUN_WORKER=true). 1 processo faz HTTP
#     + fila de envios + agendador de robôs. Ver backend/server.js.
#   • cron    → REMOVIDO: o agendador embutido já dispara o monitoramento pelos
#     robôs em "ScraperSchedules". ⚠️ Isso exige PELO MENOS UM robô ativo de tipo
#     'monitoring' na tabela — confira no /admin ou rode `npm run seed:robots`.
#     Sem nenhum robô ativo, o monitoramento NÃO roda. (Alternativa grátis:
#     o workflow .github/workflows/keepalive.yml pode disparar o run.)
#   • api     → plano `free` (dorme após ~15min ociosa; o keep-alive resolve).
#
# ⚠️ O free tier dá 750 horas-instância/mês no TOTAL. Manter 1 serviço acordado
# 24/7 consome ~730h — cabe, mas só para UM serviço free. Não crie um segundo.

envVarGroups:
  - name: newdevjobs-secrets
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: cvs
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false   # https://<api>.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        sync: false   # https://<frontend>.onrender.com
      - key: ADMIN_EMAILS
        sync: false
      - key: APIFY_TOKEN
        sync: false
      # Contas Apify extras (fallback do crédito grátis ~$5/mês). Opcionais.
      - key: APIFY_TOKEN_2
        sync: false
      - key: APIFY_TOKEN_3
        sync: false
      - key: APIFY_TOKEN_4
        sync: false
      - key: APIFY_PROFILE_ACTOR_ID
        sync: false
      - key: APIFY_POST_ACTOR_ID
        value: buIWk2uOUzTmcLsuB
      - key: RESEND_API_KEY
        sync: false   # email marketing / campanhas (dominio verificado no Resend)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false

services:
  # API HTTP + worker embutido (envios, robôs, billing, admin) — processo único.
  - type: web
    name: newdevjobs-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - fromGroup: newdevjobs-secrets
      # Processa a fila no mesmo processo. Ponha "false" só se um dia separar de
      # novo em 2 serviços (aí volte a criar o `type: worker` acima).
      - key: RUN_WORKER
        value: "true"

  # Frontend (build Vite → estático). VITE_* são lidas em BUILD time.
  - type: web
    name: newdevjobs-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    # Headers de segurança (o helmet só cobre a API; estáticos precisam disto):
    # anti-clickjacking + anti-sniffing + referrer mínimo.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA fallback (React Router)
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false   # https://<api>.onrender.com
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false

  # Site institucional (landing + docs + termos + privacidade) — HTML estático puro.
  # Os CTAs apontam para o app (newdevjobs-frontend). Sem build: só publica pages/.
  - type: web
    name: newdevjobs-site
    runtime: static
    buildCommand: echo "site estático — sem build"
    staticPublishPath: pages
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
